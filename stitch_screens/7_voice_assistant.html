<style>
        .pulse-ring {
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
                box-shadow: 0 0 0 0 rgba(244, 180, 0, 0.7);
            }
            70% {
                transform: scale(1.1);
                opacity: 0;
                box-shadow: 0 0 0 30px rgba(244, 180, 0, 0);
            }
            100% {
                transform: scale(1);
                opacity: 0;
                box-shadow: 0 0 0 0 rgba(244, 180, 0, 0);
            }
        }
        
        /* Sink effect for interactive elements */

<!-- Top Navigation (Task-focused page -> Suppress main nav, provide back button) -->
<header class="w-full max-w-[800px] flex items-center justify-between px-margin-mobile md:px-margin-desktop py-stack-sm z-50 mt-4">
<button aria-label="Go Back" class="flex items-center gap-2 h-touch-target-min px-4 rounded-xl bg-surface border-2 border-surface-variant shadow-[0_4px_12px_rgba(26,43,75,0.08)] sink-on-active transition-all">

</button>
<div class="font-headline-md text-headline-md text-primary opacity-50">Sahayak</div>

<div class="relative flex items-center justify-center w-[160px] h-[160px]">
<!-- Pulse rings -->
<div class="absolute inset-0 rounded-full bg-secondary-fixed border-[4px] border-secondary-container pulse-ring opacity-50"></div>
<div class="absolute inset-0 rounded-full bg-secondary-fixed border-[4px] border-secondary-container pulse-ring" style="animation-delay: -1s;"></div>
<!-- Main Mic Button -->

<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<h1 aria-live="polite" class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-primary text-center mt-4 tracking-tight">
                Listening...
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-[80%] mx-auto">
                Speak clearly into your phone.
            </p>
</div>

<body class="bg-surface text-on-surface font-body-lg text-body-lg antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar (From Shared Components JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b-2 border-surface-variant flex items-center justify-between px-margin-mobile md:px-margin-desktop h-[80px] max-w-screen-xl mx-auto shadow-sm">
<button aria-label="Menu" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full">

</button>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-primary-fixed tracking-tight">Sahayak</h1>
<button aria-label="Voice Search" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined text-[32px]">mic</span>
</button>
</header>
<!-- Main Content Canvas -->
<!-- Suppressed Nav Shells as this is a focused linear task ("Create My Video" intro) -->
<main class="flex-grow flex flex-col max-w-[800px] w-full mx-auto px-margin-mobile md:px-margin-desktop pt-[104px] pb-stack-lg gap-stack-lg">
<!-- Large Text Prompt -->
<section class="text-center mt-stack-md">
<h2 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-primary">
                What would you like to show today?
            </h2>
</section>
<!-- AI Explanation Card (Bento/Glass style hint but flat tactile implementation per guidelines) -->
<section class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-stack-md flex items-start gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] relative overflow-hidden">
<!-- Decorative accent line -->
<div class="absolute left-0 top-0 bottom-0 w-2 bg-secondary-container rounded-l-xl"></div>
<div class="flex-shrink-0 mt-1 pl-2">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">support_agent</span>
</div>
<div class="flex flex-col">
<p class="font-body-lg text-body-lg text-on-surface">
                    I will help you create a video. You only need to demonstrate what you know.
                </p>
</div>
</section>
<!-- Live Voice Transcription Area -->
<section class="flex-grow flex flex-col justify-center items-center gap-stack-md my-stack-md relative">
<!-- Voice Activity Indicator -->
<div class="relative flex items-center justify-center w-32 h-32">
<!-- Pulsing Outer Ring -->
<div class="absolute inset-0 bg-secondary-container rounded-full animate-pulse-ring"></div>
<!-- Inner Mic Container -->
<div class="relative z-10 w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center shadow-md border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Transcription Output Card -->
<div class="w-full bg-surface-container-lowest border-2 border-secondary-container rounded-2xl p-stack-md shadow-[0_8px_24px_rgba(26,43,75,0.12)] flex flex-col items-center text-center relative overflow-hidden">
<!-- Listening Status -->
<div class="absolute top-4 left-0 w-full flex justify-center items-center gap-2 text-on-surface-variant font-label-lg text-label-lg uppercase tracking-widest opacity-80">
<span class="material-symbols-outlined text-[20px] animate-pulse">graphic_eq</span>
<span>Listening</span>
</div>
<div class="mt-8">
<span class="font-body-md text-body-md text-on-surface-variant block mb-2">Video Topic:</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">
                        "How to Make Traditional Murukku"
                    </h3>
</div>
</div>

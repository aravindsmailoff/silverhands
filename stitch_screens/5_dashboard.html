<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SilverHands - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1a2b4b",
                        "surface-dim": "#dbdad7",
                        "on-primary": "#ffffff",
                        "secondary-container": "#fdbc13",
                        "surface-container-high": "#e9e8e5",
                        "on-tertiary-container": "#6f9f64",
                        "primary-fixed": "#d8e2ff",
                        "tertiary-fixed-dim": "#a1d494",
                        "on-surface-variant": "#44474e",
                        "inverse-on-surface": "#f2f1ee",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#002201",
                        "surface": "#faf9f6",
                        "outline": "#75777f",
                        "outline-variant": "#c5c6cf",
                        "background": "#faf9f6",
                        "on-secondary-fixed": "#261900",
                        "on-background": "#1a1c1a",
                        "on-primary-fixed-variant": "#364768",
                        "inverse-surface": "#2f312f",
                        "on-primary-container": "#8293b8",
                        "surface-container": "#efeeeb",
                        "surface-container-highest": "#e3e2e0",
                        "tertiary": "#001d01",
                        "tertiary-container": "#053405",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#5d4200",
                        "surface-tint": "#4e5e81",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#b6c6ef",
                        "on-secondary-container": "#6b4d00",
                        "secondary-fixed-dim": "#fdbc13",
                        "secondary-fixed": "#ffdea3",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#bcf0ae",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e3e2e0",
                        "on-surface": "#1a1c1a",
                        "on-tertiary-fixed-variant": "#23501e",
                        "primary": "#031635",
                        "surface-container-low": "#f4f3f1",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b6c6ef",
                        "secondary": "#7a5900",
                        "surface-bright": "#faf9f6",
                        "on-primary-fixed": "#081b3a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "stack-sm": "12px",
                        "touch-target-min": "56px",
                        "gutter": "20px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px",
                        "stack-lg": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Lexend"],
                        "headline-xl": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "headline-xl-mobile": ["Lexend"],
                        "body-md": ["Lexend"],
                        "headline-lg-mobile": ["Lexend"],
                        "label-lg": ["Lexend"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mic-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(253, 188, 19, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(253, 188, 19, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(253, 188, 19, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-col pt-[80px] pb-[120px] max-w-[800px] mx-auto antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b-2 border-surface-variant flex items-center justify-between px-margin-mobile md:px-margin-desktop h-[80px] max-w-[800px] mx-auto">
<button aria-label="Open Menu" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-[32px]">menu</span>
</button>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight">Sahayak</h1>
<div class="h-touch-target-min w-touch-target-min"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile md:px-margin-desktop py-stack-lg flex flex-col gap-stack-lg w-full">
<!-- Greeting -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-primary">Good Morning, Lakshmi Amma</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">What would you like to do today?</p>
</section>
<!-- Dashboard Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md w-full">
<!-- Card: Create a Video -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">videocam</span>
<span class="font-headline-md text-headline-md text-primary text-center">Create a Video</span>
</button>
<!-- Card: My Classes -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-headline-md text-headline-md text-primary text-center">My Classes</span>
</button>
<!-- Card: My Products -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="font-headline-md text-headline-md text-primary text-center">My Products</span>
</button>
<!-- Card: My Social Media -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">smartphone</span>
<span class="font-headline-md text-headline-md text-primary text-center">My Social Media</span>
</button>
<!-- Card: My Earnings -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-headline-md text-headline-md text-primary text-center">My Earnings</span>
</button>
<!-- Card: My Profile -->
<button class="bg-[#FFFFFF] border-2 border-[#E2E5E9] rounded-xl p-stack-md flex flex-col items-center justify-center gap-stack-sm shadow-[0_4px_12px_rgba(26,43,75,0.08)] hover:bg-surface-container-low transition-all active:shadow-none active:border-primary-container h-[180px]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-headline-md text-headline-md text-primary text-center">My Profile</span>
</button>
</section>
</main>
<!-- Persistent Bottom Action (Voice-First) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-sm border-t border-surface-variant p-gutter z-50 flex justify-center pb-8">
<button class="bg-primary text-on-primary w-full max-w-[400px] h-[80px] rounded-full flex items-center justify-center gap-stack-sm shadow-lg hover:bg-primary-container transition-all active:scale-95 group">
<div class="bg-secondary-container text-on-secondary-container rounded-full p-2 mic-pulse flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<span class="font-headline-md text-headline-md">Talk to SilverHands</span>
</button>
</div>
</body></html>
